<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>TV Screen</title><style>:root{--vetro-action:#3b6cf6;--s3:12px;--edge:rgba(128,128,128,.4);--zoom:1.5}
*{box-sizing:border-box}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;margin:16px;color:CanvasText;background:Canvas}
.layout{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.view{flex:0 0 auto;max-width:100%;min-width:0;width:fit-content}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 8px;width:0;min-width:100%}
.bar h2{font-size:17px;margin:0 auto 0 0}
.ui{font:inherit;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--edge);background:transparent;color:inherit;cursor:pointer}
.ui:hover{background:rgba(128,128,128,.15)}.ui:disabled{opacity:.5;cursor:default}
.ui:focus-visible{outline:2px solid var(--vetro-action);outline-offset:2px}
.ui.primary{background:var(--vetro-action);border-color:var(--vetro-action);color:#fff}
.zoom{display:flex;border:1px solid var(--edge);border-radius:8px;overflow:hidden}
.zoom .ui{border:0;border-radius:0;padding:0 11px}.zoom .ui[aria-pressed=true]{background:var(--vetro-action);color:#fff}
.frame{position:relative;width:calc(640px*var(--zoom));max-width:100%;border:1px solid var(--edge);border-radius:8px;overflow:hidden;background:#000}
.frame canvas{display:block;width:100%;height:auto}
.frame img{position:absolute;top:0;left:0;width:100%;height:100%;display:block;background:#000;object-fit:fill}
.frame img[hidden]{display:none}
.status{font-size:13px;opacity:.75;margin:0 0 8px;min-height:1.45em;width:0;min-width:100%}
.remote{flex:0 0 auto;display:grid;justify-items:center;max-width:100%}
/* Fit: the picture takes the room the remote leaves (a Shard page cannot widen the dashboard) */
@media (min-width:900px){.layout.fit{flex-wrap:nowrap}.layout.fit .view{flex:1 1 0;width:auto}}
.layout.fit .frame{width:100%}
.rc-note{opacity:.75}.rc{--rc-key:#26272b;--rc-key-hi:#34353a;--rc-ink:#e9e9ec;--rc-dim:#9a9ba1;width:220px;box-sizing:border-box;padding:26px 22px 22px;border-radius:54px;background:linear-gradient(160deg,#2b2c30 0%,#17181b 55%,#101113 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.10),inset 0 -2px 6px rgba(0,0,0,.6),0 18px 40px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.4);display:grid;gap:22px;justify-items:center;color:var(--rc-ink);user-select:none;-webkit-user-select:none}.rc button{margin:0;padding:0;min-height:0;border:0;color:var(--rc-ink);cursor:pointer;display:grid;place-items:center;background:var(--rc-key);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 2px 3px rgba(0,0,0,.5);transition:transform .06s,background .12s}.rc button:hover{background:var(--rc-key-hi)}.rc button:active{transform:scale(.94);box-shadow:inset 0 2px 4px rgba(0,0,0,.6)}.rc button:focus-visible{outline:2px solid var(--vetro-action);outline-offset:2px}.rc svg{width:22px;height:22px}.rc-top{width:100%;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;justify-items:center}.rc-power{width:40px;height:40px;border-radius:50%}.rc-power svg{color:#ff5a4f;width:20px;height:20px}.rc-mic{width:6px;height:6px;border-radius:50%;background:#050506;box-shadow:inset 0 1px 1px rgba(255,255,255,.15)}.rc-ring{position:relative;width:164px;height:164px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#2e2f34,#1c1d20 70%);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 3px 8px rgba(0,0,0,.55)}.rc .rc-dir{position:absolute;width:48px;height:48px;border-radius:50%;background:transparent;box-shadow:none;color:var(--rc-dim)}.rc .rc-dir:hover{color:var(--rc-ink);background:rgba(255,255,255,.06)}.rc-up{top:4px;left:58px}.rc-down{bottom:4px;left:58px}.rc-left{left:4px;top:58px}.rc-right{right:4px;top:58px}.rc .rc-ok{position:absolute;left:44px;top:44px;width:76px;height:76px;border-radius:50%;background:#121315;box-shadow:inset 0 2px 5px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06);font-weight:600;font-size:15px;letter-spacing:.06em}.rc .rc-ok:hover{background:#18191c}.rc-row{display:flex;gap:44px}.rc .rc-round{width:48px;height:48px;border-radius:50%}.rc-rockers{display:flex;gap:40px}.rc-rocker{display:grid;grid-template-rows:auto auto auto;width:54px;border-radius:27px;overflow:hidden;background:var(--rc-key);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 2px 4px rgba(0,0,0,.5)}.rc .rc-rk{width:54px;border-radius:0;background:transparent;box-shadow:none;font-size:22px;font-weight:300;color:var(--rc-ink)}.rc .rc-rk:hover{background:var(--rc-key-hi)}.rc .rc-rk-top,.rc .rc-rk-bot{height:48px}.rc .rc-rk-mid{height:44px;display:grid;place-items:center;gap:0;border-top:1px solid rgba(0,0,0,.35);border-bottom:1px solid rgba(0,0,0,.35)}.rc .rc-rk-mid svg{width:17px;height:17px;color:var(--rc-dim)}.rc-rk small,.rc-label small{font-size:10px;letter-spacing:.12em;color:var(--rc-dim);font-weight:600;line-height:1}.rc .rc-rk-mid:hover svg{color:var(--rc-ink)}.rc-apps{display:flex;gap:10px;margin-top:4px}.rc .rc-app{display:flex;align-items:center;gap:7px;height:30px;padding:0 14px;border-radius:15px;font-size:12px;font-weight:600;letter-spacing:.03em;background:linear-gradient(180deg,#2f3036,#222327)}.rc .rc-app img{border-radius:4px}.rc-brand{font-size:11px;letter-spacing:.32em;color:#55565c;font-weight:700;margin-top:2px}.rc.rc-full{width:auto;display:grid;grid-template-columns:200px 200px;column-gap:26px;row-gap:14px;padding:24px 24px 18px;border-radius:44px;align-items:start}.rc-col{display:grid;gap:14px;justify-items:center;width:200px}.rc-full .rc-brand{grid-column:1/-1}.rc button{touch-action:manipulation;-webkit-touch-callout:none}.rc button.rc-held{transform:scale(.94);background:var(--rc-key-hi);box-shadow:inset 0 2px 4px rgba(0,0,0,.6)}.rc-full .rc-top{grid-template-columns:44px 1fr 44px}.rc-full .rc-row{display:flex;gap:26px}.rc .rc-sm{width:40px;height:40px}.rc .rc-sm svg{width:19px;height:19px;color:var(--rc-dim)}.rc .rc-sm:hover svg{color:var(--rc-ink)}.rc-full .rc-ring{width:156px;height:156px}.rc-full .rc-up{top:3px;left:54px}.rc-full .rc-down{bottom:3px;left:54px}.rc-full .rc-left{left:3px;top:54px}.rc-full .rc-right{right:3px;top:54px}.rc-full .rc-ok{left:42px;top:42px;width:72px;height:72px}.rc-full .rc-rockers{gap:14px;align-items:center}.rc-mid{display:grid;gap:10px}.rc .rc-txt{height:28px;min-width:50px;padding:0 8px;border-radius:14px;font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--rc-dim)}.rc .rc-txt:hover{color:var(--rc-ink)}.rc-pad{display:grid;grid-template-columns:repeat(3,58px);gap:8px 13px}.rc .rc-num{height:34px;border-radius:17px;font-size:16px;font-weight:500}.rc .rc-num-s{font-size:9px;font-weight:700;letter-spacing:.06em;color:var(--rc-dim)}.rc-colors{display:grid;grid-template-columns:repeat(4,41px);gap:12px}.rc .rc-color{height:18px;border-radius:9px;font-size:9px;font-weight:800;color:rgba(0,0,0,.55)}.rc .rc-red,.rc .rc-red:hover{background:#d8443a}.rc .rc-green,.rc .rc-green:hover{background:#3fa55a}.rc .rc-yellow,.rc .rc-yellow:hover{background:#e0bb38}.rc .rc-blue,.rc .rc-blue:hover{background:#3f78d6}.rc .rc-color:hover{filter:brightness(1.15)}.rc-play{display:grid;grid-template-columns:repeat(4,41px);gap:8px 12px}.rc .rc-pb{height:32px;border-radius:16px}.rc .rc-pb svg{width:16px;height:16px;color:var(--rc-dim)}.rc .rc-pb:hover svg{color:var(--rc-ink)}.rc .rc-rec svg{color:#ff5a4f}.rc-extra{display:grid;grid-template-columns:repeat(3,62px);gap:8px 7px}.rc-extra .rc-txt{min-width:0;padding:0;font-size:9px;letter-spacing:.05em}.rc-full .rc-apps{gap:8px;margin-top:0}.rc .rc-app svg{width:17px;height:17px}.rc .rc-app[aria-pressed=true]{background:var(--vetro-action);color:#fff}.rc-note{margin:var(--s3) 0 0;max-width:450px;min-height:3.2em;font-size:12px;color:var(--vetro-muted,#9a9ba1);text-align:center}@media (max-width:560px){.rc.rc-full{grid-template-columns:200px}}.rc .rc-app{padding:0 10px}
.rc .rc-more{width:100%;height:26px}
.rc.rc-full.rc-collapsed{grid-template-columns:200px}
.rc-collapsed .rc-keys{display:none}</style></head><body><div class="layout fit" id="layout"><div class="view"><div class="bar"><h2>TV screen</h2><div class="zoom" id="zoom" role="group" aria-label="Picture size"><button class="ui" data-zoom="fit" aria-pressed="true">Fit</button><button class="ui" data-zoom="1" aria-pressed="false">1×</button><button class="ui" data-zoom="1.5" aria-pressed="false">1.5×</button><button class="ui" data-zoom="2" aria-pressed="false">2×</button></div><button class="ui primary" id="live">Watch live</button><button class="ui" id="shot">Take a picture</button></div><p class="status" id="status" aria-live="polite"></p><div class="frame"><canvas id="canvas" width="1920" height="1080" role="img" aria-label="TV screen picture"></canvas><img id="stream" alt="Live TV screen" crossorigin="anonymous" hidden></div></div><div class="remote"><div class="rc rc-full" id="screenKeys" role="group" aria-label="TV remote"><div class="rc-col"><div class="rc-top"><button class="rc-power" data-key="XF86PowerOff" aria-label="Power" title="Power"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg></button><span class="rc-mic" aria-hidden="true"></span><button class="rc-round rc-sm" data-key="XF86Display" aria-label="Source" title="Source"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="4" width="12" height="16" rx="2"/><path d="M2 12h11"/><path d="m9.5 8.5 3.5 3.5-3.5 3.5"/></svg></button></div><div class="rc-row"><button class="rc-round rc-sm" data-key="XF86SysMenu" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-. use" aria-label="Pause" title="Pause"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor" stroke="none"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button><button class="rc-pb" data-key="XF86AudioForward" aria-label="Fast forward" title="Fast forward"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor" stroke="none"><path d="M13 6v12l8-6zM3 6v12l8-6z"/></svg></button><button class="rc-pb" data-key="XF86AudioPrev" aria-label="Previous" title="Previous"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor" stroke="none"><path d="M6 5h2.5v14H6zM20 5v14l-10-7z"/></svg></button><button class="rc-pb" data-key="XF86AudioStop" aria-label="Stop" title="Stop"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor" stroke="none"><rect x="6" y="6" width="12" height="12" rx="1"/></svg></button><button class="rc-pb rc-rec" data-key="XF86AudioRecord" aria-label="Record" title="Record"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor" stroke="none"><circle cx="12" cy="12" r="6"/></svg></button><button class="rc-pb" data-key="XF86AudioNext" aria-label="Next" title="Next"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor" stroke="none"><path d="M15.5 5H18v14h-2.5zM4 5v14l10-7z"/></svg></button></div><div class="rc-extra"><button class="rc-txt" data-key="XF86Caption" aria-label="Subtitles" title="Subtitles"><span>SUBT</span></button><button class="rc-txt" data-key="XF86AudioDescription" aria-label="Audio description" title="Audio description"><span>AD</span></button><button class="rc-txt" data-key="XF86PictureSize" aria-label="Picture size" title="Picture size"><span>P.SIZE</span></button><button class="rc-txt" data-key="XF86DiscretSourceTV" aria-label="Live TV" title="Live TV"><span>TV</span></button><button class="rc-txt" data-key="XF86Apps" aria-label="Apps" title="Apps"><span>APPS</span></button><button class="rc-txt" data-key="XF86EManual" aria-label="e-Manual" title="e-Manual"><span>E-MANUAL</span></button><button class="rc-txt" data-key="XF86MultiView" aria-label="Multi View" title="Multi View"><span>MULTI</span></button><button class="rc-txt" data-key="XF86Ambient" aria-label="Ambient mode" title="Ambient mode"><span>AMBIENT</span></button><button class="rc-txt" data-key="XF86Sleep" aria-label="Sleep timer" title="Sleep timer"><span>SLEEP</span></button><button class="rc-txt" data-key="XF86Netflix" aria-label="Netflix" title="Netflix"><span>NETFLIX</span></button><button class="rc-txt" data-key="XF86Amazon" aria-label="Prime Video" title="Prime Video"><span>PRIME</span></button><button class="rc-txt" data-key="XF86KeyTVPlus" aria-label="Samsung TV Plus" title="Samsung TV Plus"><span>TV PLUS</span></button></div></div><div class="rc-brand" aria-hidden="true">SAMSUNG</div></div><p class="rc-note" id="screenKbdNote" aria-live="polite">Hold a button for a long press.</p></div></div><script>function $(id){return document.getElementById(id)}

  return fetch(url,o).then(function(r){return r.json().catch(function(){return {}}).then(function(d){if(!r.ok)throw new Error(d.error||('The TV answered '+r.status));return d})})}
function say(t){$('status').textContent=t}

/* picture and live view */
var busy=false,liveOn=false,liveTimer=0;
function shape(w,h){return 'captured at '+w+'×'+h+(Math.abs(w/h-16/9)>0.05?', shown at 16:9':'')}
function liveStatus(){api('live').then(function(d){if(!liveOn)return;if(d.running===false){say('Starting the live view…');return}
  say(d.protect===1?'Live · protected video (DRM/HDCP): the TV refuses to capture it':'Live · '+d.fps+' fps · '+shape(d.width,d.height))}).catch(function(){})}
function liveStart(){var i=$('stream');liveOn=true;i.hidden=false;i.src='stream?t='+Date.now();$('live').textContent='Stop live';
  say('Starting the live view…');liveTimer=setInterval(liveStatus,2000)}
function liveStop(text){if(!liveOn)return;liveOn=false;clearInterval(liveTimer);var i=$('stream');i.removeAttribute('src');i.hidden=true;
  $('live').textContent='Watch live';say(text||'Live view stopped.')}
/* a picture is saved the way the browser saves a download; the images are asked for with CORS so the canvas can be read back */
function stamp(){var d=new Date();function p(n){return (n<10?'0':'')+n}return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds())}
function savePng(c){try{c.toBlob(function(b){if(!b){say('Could not save the picture.');return}var a=document.createElement('a'),u=URL.createObjectURL(b);
    a.href=u;a.download='tv-screen-'+stamp()+'.png';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},10000)},'image/png')}
  catch(e){say('Could not save the picture: '+e.message)}}
function saveLiveFrame(){var c=document.createElement('canvas');c.width=1920;c.height=1080;
  try{c.getContext('2d').drawImage($('stream'),0,0,1920,1080)}catch(e){say('No live frame yet.');return}savePng(c)}
function takeShot(save){if(busy)return;busy=true;$('shot').disabled=true;say('Capturing the screen…');
  api('shot').then(function(d){return Promise.all(d.windows.map(function(w){return new Promise(function(done){var img=new Image();img.crossOrigin='anonymous';
      img.onload=function(){done({w:w,img:img})};img.onerror=function(){done(null)};img.src='file?id='+encodeURIComponent(w.id)+'&at='+d.at})})).then(function(list){
    var c=$('canvas'),g=c.getContext('2d'),n=0;g.fillStyle='#000';g.fillRect(0,0,c.width,c.height);
    if(d.video&&d.source!=='scaler'){g.fillStyle='#3a4560';g.font='600 46px system-ui,sans-serif';g.textAlign='center';g.textBaseline='middle';
      g.fillText(d.protected?'Protected video (DRM/HDCP) is playing here, not captured':'Video is playing here (hardware layer, not captured)',960,540)}
    list.forEach(function(x){if(!x)return;g.drawImage(x.img,x.w.x,x.w.y,x.w.w,x.w.h);n++});
    say('Captured '+new Date(d.at).toLocaleTimeString()+' · '+(d.source==='scaler'?'full picture'+(d.size?' · '+shape(d.size.w,d.size.h):''):
      n+' window'+(n===1?'':'s')+(d.video?(d.protected?' · protected video is not captured':' · video is not captured'):''))+(save?' · saved':''));
    if(save)savePng(c)})})
  .catch(function(e){say(e.message)}).then(function(){busy=false;$('shot').disabled=false})}
$('shot').onclick=function(){if(liveOn)saveLiveFrame();else takeShot(true)};
$('live').onclick=function(){if(liveOn)liveStop();else liveStart()};
$('stream').onerror=function(){if(liveOn)liveStop('The live view could not start.')};
document.addEventListener('visibilitychange',function(){if(document.hidden)liveStop()});

/* picture size */
function zoom(z,quiet){if(z!=='fit'&&z!=='1'&&z!=='1.5'&&z!=='2')return;$('layout').classList.toggle('fit',z==='fit');if(z!=='fit')document.documentElement.style.setProperty('--zoom',z);
  Array.prototype.forEach.call($('zoom').querySelectorAll('[data-zoom]'),function(b){b.setAttribute('aria-pressed',b.dataset.zoom===z?'true':'false')});
  if(!quiet)api('prefs',{zoom:z}).catch(function(){})}
$('zoom').onclick=function(e){var b=e.target.closest('[data-zoom]');if(b)zoom(b.dataset.zoom)};
/* the right half of the remote folds away */
function rcMore(open,quiet){$('screenKeys').classList.toggle('rc-collapsed',!open);var b=$('rcMore');b.setAttribute('aria-expanded',open?'true':'false');
  b.textContent=open?'‹ HIDE KEYS':'MORE KEYS ›';if(!quiet)api('prefs',{keys:open}).catch(function(){})}
$('rcMore').onclick=function(){rcMore(this.getAttribute('aria-expanded')!=='true')};
/* the page is sandboxed and has no storage of its own: the Shard keeps the two choices */
api('prefs').then(function(p){zoom(p.zoom,true);if(p.keys===false)rcMore(false,true)}).catch(function(){});

/* remote: a button is down while it is held; events go out in order, batched while a request is in flight */
var rcQueue=[],rcBusy=false,rcDown={},kbdOn=false,kbdHeld={};
var NOTE='Hold a button for a long press.',KBD_NOTE='Keyboard goes to the TV. Open the text field on the TV first. Esc is Back, F1 to F4 are the colour keys. Click Keyboard again to stop.';
var KBD_MAP={Space:'space',Enter:'Return',NumpadEnter:'KP_Enter',Backspace:'BackSpace',Tab:'Tab',Escape:'XF86Back',Delete:'Delete',Insert:'Insert',Home:'Home',End:'End',
  PageUp:'Prior',PageDown:'Next',ArrowUp:'Up',ArrowDown:'Down',ArrowLeft:'Left',ArrowRight:'Right',ShiftLeft:'Shift_L',ShiftRight:'Shift_R',ControlLeft:'Control_L',
  ControlRight:'Control_R',AltLeft:'Alt_L',AltRight:'Alt_R',CapsLock:'Caps_Lock',Minus:'minus',Equal:'equal',BracketLeft:'bracketleft',BracketRight:'bracketright',
  Backslash:'backslash',Semicolon:'semicolon',Quote:'apostrophe',Backquote:'grave',Comma:'comma',Period:'period',Slash:'slash',NumpadAdd:'KP_Add',
  NumpadSubtract:'KP_Subtract',NumpadMultiply:'KP_Multiply',NumpadDivide:'KP_Divide',NumpadDecimal:'period',F1:'XF86Red',F2:'XF86Green',F3:'XF86Yellow',
  F4:'XF86Blue',F5:'XF86Home',F8:'XF86AudioMute',F9:'XF86AudioLowerVolume',F10:'XF86AudioRaiseVolume'};
function rcFlush(){if(rcBusy||!rcQueue.length)return;rcBusy=true;
  api('control',{events:rcQueue.splice(0,40)}).then(function(d){if(d&&d.ok===false&&d.error)say(d.error)}).catch(function(x){say(x.message)})
  .then(function(){rcBusy=false;rcFlush()})}
function rcSend(key,state){rcQueue.push({key:key,state:state});rcFlush()}
function rcPress(e){var b=e.target.closest('[data-key]');if(!b||e.button)return;var k=b.dataset.key;try{b.setPointerCapture(e.pointerId)}catch(x){}
  b.classList.add('rc-held');if(!rcDown[k]){rcDown[k]=b;rcSend(k,'down')}}
function rcLift(e){var b=e.target.closest('[data-key]');if(!b)return;var k=b.dataset.key;b.classList.remove('rc-held');if(rcDown[k]){delete rcDown[k];rcSend(k,'up')}}
function rcLiftAll(){Object.keys(rcDown).forEach(function(k){rcDown[k].classList.remove('rc-held');delete rcDown[k];rcSend(k,'up')});
  Object.keys(kbdHeld).forEach(function(c){var k=kbdHeld[c];delete kbdHeld[c];rcSend(k,'up')})}
var rc=$('screenKeys');rc.onpointerdown=rcPress;rc.onpointerup=rcLift;rc.onpointercancel=rcLift;rc.onlostpointercapture=rcLift;
/* a button worked from the keyboard (Enter, Space) has no pointer: one press */
rc.onclick=function(e){if(e.detail!==0)return;var b=e.target.closest('[data-key]');if(b)rcSend(b.dataset.key,'press')};
rc.oncontextmenu=function(e){if(e.target.closest('[data-key]'))e.preventDefault()};
$('screenLauncher').onclick=function(){var b=this;b.disabled=true;api('launcher',{}).then(function(d){say(d.ok===false?d.error:'Vetro launcher opened on the TV.')})
  .catch(function(x){say(x.message)}).then(function(){b.disabled=false})};

/* this computer's keyboard: physical keys (e.code) as the TV's key names; the TV's own layout makes the characters */
function kbdName(e){var c=e.code||'';if(c.length===4&&c.indexOf('Key')===0)return c.charAt(3).toLowerCase();
  if(c.length===6&&c.indexOf('Digit')===0)return c.charAt(5);
  if(c.length===7&&c.indexOf('Numpad')===0&&c.charAt(6)>='0'&&c.charAt(6)<='9')return c.charAt(6);
  if(c==='Minus'&&!e.shiftKey)return 'KP_Subtract';   /* TV text fields ignore the plain minus key: it is the remote's dash */
  return KBD_MAP.hasOwnProperty(c)?KBD_MAP[c]:null}
function kbdSet(on){kbdOn=on;$('screenKbd').setAttribute('aria-pressed',on?'true':'false');$('screenKbdNote').textContent=on?KBD_NOTE:NOTE;
  if(!on){rcLiftAll();api('control',{release:true}).catch(function(){})}}
function kbdDown(e){if(!kbdOn)return;var k=kbdName(e);if(!k)return;e.preventDefault();e.stopPropagation();if(e.repeat||kbdHeld[e.code])return;
  /* Windows sends AltGr as Control + Alt: drop the Control it made up */
  if(e.code==='AltRight'&&e.key==='AltGraph'&&kbdHeld.ControlLeft){delete kbdHeld.ControlLeft;rcSend('Control_L','up')}
  kbdHeld[e.code]=k;rcSend(k,'down')}
function kbdUp(e){if(!kbdOn)return;var k=kbdHeld[e.code];if(!k)return;e.preventDefault();e.stopPropagation();delete kbdHeld[e.code];rcSend(k,'up')}
document.addEventListener('keydown',kbdDown,true);document.addEventListener('keyup',kbdUp,true);
/* this page is a frame: once the focus leaves it no key arrives here, so the keyboard is handed back */
window.addEventListener('blur',function(){if(kbdOn)kbdSet(false);else rcLiftAll()});
window.addEventListener('pagehide',function(){try{navigator.sendBeacon('control',JSON.stringify({release:true}))}catch(e){}});
$('screenKbd').onclick=function(){kbdSet(!kbdOn);this.blur()};

takeShot(false);</script></body></html>
